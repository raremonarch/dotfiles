# Hypridle Configuration
# Idle management daemon - works across Hyprland, Niri, and Sway

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = sh -c 'if pgrep -x Hyprland >/dev/null 2>&1; then hyprctl dispatch dpms on; elif pgrep -x niri >/dev/null 2>&1; then niri msg action power-on-monitors; elif pgrep -x sway >/dev/null 2>&1; then swaymsg "output * dpms on"; elif pgrep -x mango >/dev/null 2>&1; then wlopm --on "*"; fi'
    ignore_dbus_inhibit = true                  # Teams/Discord call Inhibit(); 0.1.8 fixed counting so now we must ignore
}

# Lock screen after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off monitors after 10 minutes (600 seconds)
# Detects the running compositor by process name, not by which binaries happen
# to be installed (e.g. `niri` is installed but not running when Mango is the WM).
listener {
    timeout = 600
    on-timeout = sh -c 'if pgrep -x Hyprland >/dev/null 2>&1; then hyprctl dispatch dpms off; elif pgrep -x niri >/dev/null 2>&1; then niri msg action power-off-monitors; elif pgrep -x sway >/dev/null 2>&1; then swaymsg "output * dpms off"; elif pgrep -x mango >/dev/null 2>&1; then wlopm --off "*"; fi'
    on-resume = sh -c 'if pgrep -x Hyprland >/dev/null 2>&1; then hyprctl dispatch dpms on; elif pgrep -x niri >/dev/null 2>&1; then niri msg action power-on-monitors; elif pgrep -x sway >/dev/null 2>&1; then swaymsg "output * dpms on"; elif pgrep -x mango >/dev/null 2>&1; then wlopm --on "*"; fi'
}
